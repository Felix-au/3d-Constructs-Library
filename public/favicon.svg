<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ffff0"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="goldTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb829"/>
      <stop offset="100%" stop-color="#0ffff0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="512" height="512" rx="112" fill="#090d16"/>
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)"/>

  <!-- 3D Particle Construct Wireframe -->
  <g filter="url(#glow)">
    <!-- Outer 3D Polygon Bounds -->
    <polygon points="256,76 406,162 406,336 256,422 106,336 106,162" fill="none" stroke="url(#cyanTeal)" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Perspective Lines -->
    <line x1="256" y1="76" x2="256" y2="249" stroke="url(#cyanTeal)" stroke-width="8"/>
    <line x1="406" y1="162" x2="256" y2="249" stroke="url(#cyanTeal)" stroke-width="8"/>
    <line x1="106" y1="162" x2="256" y2="249" stroke="url(#cyanTeal)" stroke-width="8"/>
    
    <line x1="256" y1="422" x2="256" y2="249" stroke="url(#goldTeal)" stroke-width="6" stroke-dasharray="10 10" opacity="0.6"/>
    <line x1="406" y1="336" x2="256" y2="249" stroke="url(#goldTeal)" stroke-width="6" stroke-dasharray="10 10" opacity="0.6"/>
    <line x1="106" y1="336" x2="256" y2="249" stroke="url(#goldTeal)" stroke-width="6" stroke-dasharray="10 10" opacity="0.6"/>

    <!-- Glowing Particle Vertices -->
    <circle cx="256" cy="76" r="18" fill="#0ffff0"/>
    <circle cx="256" cy="249" r="24" fill="#ffffff"/>
    <circle cx="256" cy="249" r="34" fill="none" stroke="#0ffff0" stroke-width="5"/>
    <circle cx="406" cy="162" r="16" fill="#0d9488"/>
    <circle cx="106" cy="162" r="16" fill="#0d9488"/>
    <circle cx="406" cy="336" r="16" fill="#ffb829"/>
    <circle cx="106" cy="336" r="16" fill="#ffb829"/>
    <circle cx="256" cy="422" r="18" fill="#0ffff0"/>

    <!-- Orbiting Swarm Particles -->
    <circle cx="190" cy="125" r="9" fill="#0ffff0" opacity="0.9"/>
    <circle cx="330" cy="135" r="7" fill="#ffb829" opacity="0.85"/>
    <circle cx="365" cy="240" r="10" fill="#0ffff0" opacity="0.95"/>
    <circle cx="145" cy="270" r="8" fill="#0d9488" opacity="0.8"/>
    <circle cx="210" cy="375" r="9" fill="#0ffff0" opacity="0.9"/>
    <circle cx="310" cy="360" r="8" fill="#ffb829" opacity="0.85"/>
  </g>
</svg>